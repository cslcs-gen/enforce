                      <div style={styles.bar(ps.score)}><div style={styles.barFill(ps.score)} /></div>
                      <span style={{ fontWeight: 700, color: ps.score >= 9 ? "#e63946" : ps.score >= 8 ? "#f4a261" : "#2a9d8f" }}>{ps.score}</span>
                    </div>
                  </td>
                  <td style={{ ...styles.execTd(false), color: "#8b949e", fontSize: 12 }}>{ps.reason}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <p style={{ color: "#8b949e", fontSize: 12, marginTop: 10 }}>↑ Click any row to view the full problem statement pitch</p>
      </div>

      <div style={{ ...styles.card, marginTop: 8 }}>
        <span style={styles.sectionLabel}>Recommended POC Sequence</span>
        <div style={{ display: "flex", gap: 0, flexWrap: "wrap" }}>
          {[
            { phase: "Week 1–2", items: ["PS-02: Complaint Triage", "PS-06: Regulatory Assistant"], color: "#e63946" },
            { phase: "Week 3–4", items: ["PS-01: Field Inspection Notes", "PS-08: Case Summary Gen"], color: "#f4a261" },
            { phase: "Week 5–6", items: ["PS-03: Online Detection", "PS-05: Inspection Planning"], color: "#2a9d8f" },
            { phase: "Month 3+", items: ["PS-04: Pattern Detection", "PS-07: Adverse Events"], color: "#8957e5" },
          ].map(p => (
            <div key={p.phase} style={{ flex: "1 1 200px", borderLeft: `3px solid ${p.color}`, paddingLeft: 14, paddingRight: 14, marginBottom: 12 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: p.color, textTransform: "uppercase", letterSpacing: 1 }}>{p.phase}</div>
              {p.items.map(it => <div key={it} style={{ fontSize: 12, color: "#8b949e", marginTop: 4 }}>{it}</div>)}
            </div>
          ))}
        </div>
      </div>
    </div>
  );

  const renderPSGrid = () => (
    <div>
      <p style={{ color: "#8b949e", marginBottom: 20, fontSize: 13 }}>Select a problem statement to view the full pitch:</p>
      <div style={styles.psGrid}>
        {problemStatements.map(ps => (
          <div key={ps.id} style={styles.psCard(ps.priority)}
            onClick={() => { setActivePS(ps.id); setTab("detail"); }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = "#00b4d8"; e.currentTarget.style.transform = "translateY(-2px)"; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = "#30363d"; e.currentTarget.style.transform = "none"; }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
              <span style={{ fontFamily: "monospace", fontSize: 11, color: accentColor, fontWeight: 700 }}>{ps.id}</span>
              {priorityBadge(ps.priority)}
            </div>
            <div style={{ fontWeight: 700, color: "#e6edf3", fontSize: 14, marginBottom: 8, lineHeight: 1.4 }}>{ps.title}</div>
            <div style={{ fontSize: 12, color: "#8b949e", lineHeight: 1.5, marginBottom: 12 }}>{ps.tagline}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={styles.bar(ps.priorityScore)}><div style={styles.barFill(ps.priorityScore)} /></div>
              <span style={{ fontSize: 12, fontWeight: 700, color: "#e6edf3" }}>{ps.priorityScore}/10</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  const renderDetail = () => {
    const ps = problemStatements.find(p => p.id === activePS);
    if (!ps) return null;
    const accentMap = { Critical: "#e63946", High: "#f4a261", Medium: "#2a9d8f" };
    const accent = accentMap[ps.priority];

    return (
      <div>
        <button style={styles.backBtn} onClick={() => { setActivePS(null); setTab("statements"); }}>
          ← Back to all problem statements
        </button>

        {/* Header */}
        <div style={{ borderLeft: `4px solid ${accent}`, paddingLeft: 20, marginBottom: 28 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
            <span style={{ fontFamily: "monospace", color: accentColor, fontWeight: 800, fontSize: 13 }}>{ps.id}</span>
            {priorityBadge(ps.priority)}
            <span style={{ fontSize: 12, color: "#8b949e" }}>Priority Score: <strong style={{ color: "#e6edf3" }}>{ps.priorityScore}/10</strong></span>
          </div>
          <h2 style={{ margin: "0 0 6px", fontSize: 22, fontWeight: 800, color: "#e6edf3" }}>{ps.title}</h2>
          <p style={{ margin: 0, color: "#8b949e", fontSize: 14, fontStyle: "italic" }}>"{ps.tagline}"</p>
        </div>

        {/* Why this is a priority */}
        <div style={{ ...styles.card, borderLeft: `3px solid ${accent}`, marginBottom: 20 }}>
          <span style={{ ...styles.sectionLabel, color: accent }}>Why This Is A Priority</span>
          <p style={{ margin: 0, color: "#e6edf3", lineHeight: 1.7, fontSize: 13 }}>{ps.priorityReason}</p>
        </div>

        {/* Users */}
        <div style={styles.card}>
          <span style={styles.sectionLabel}>Users</span>
          <p style={{ margin: 0, color: "#8b949e", lineHeight: 1.7, fontSize: 13 }}>{ps.users}</p>
        </div>

        {/* Use Case + Pain Points */}
        <div style={styles.twoCol}>
          <div style={styles.card}>
            <span style={styles.sectionLabel}>Use Case</span>
            <p style={{ margin: 0, color: "#8b949e", lineHeight: 1.7, fontSize: 13 }}>{ps.useCase}</p>
          </div>
          <div style={styles.card}>
            <span style={styles.sectionLabel}>Pain Points</span>
            {ps.painPoints.map((p, i) => (
              <div key={i} style={{ ...styles.bullet, marginBottom: 8 }}>
                <span style={styles.dot}>▸</span>
                <span style={{ color: "#8b949e", lineHeight: 1.6, fontSize: 13 }}>{p}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Consequence */}
        <div style={{ ...styles.card, background: "#1a0f0f", borderColor: "#e6394640" }}>
          <span style={{ ...styles.sectionLabel, color: "#e63946" }}>Consequence If Unsolved</span>
          <p style={{ margin: 0, color: "#c9848a", lineHeight: 1.7, fontSize: 13 }}>{ps.consequence}</p>
        </div>

        {/* Global Reference */}
        <div style={styles.card}>
          <span style={styles.sectionLabel}>Global Market Reference</span>
          <div style={styles.globalRef}>{ps.globalRef}</div>
        </div>

        {/* AI Solution */}
        <div style={styles.card}>
          <span style={styles.sectionLabel}>Proposed AI Solution</span>
          <p style={{ margin: "0 0 14px", color: "#e6edf3", lineHeight: 1.7, fontSize: 13 }}>{ps.aiSolution}</p>
          <span style={{ fontSize: 11, fontWeight: 700, color: "#8b949e", textTransform: "uppercase", letterSpacing: 1 }}>AI Techniques:</span>
          <div style={{ marginTop: 6 }}>
            {ps.aiTechniques.map(t => <span key={t} style={styles.pillHighlight}>{t}</span>)}
          </div>
        </div>

        {/* Northstar + POC */}
        <div style={styles.twoCol}>
          <div style={{ ...styles.card, ...styles.northstarBox }}>
            <span style={{ ...styles.sectionLabel, color: "#8957e5" }}>Northstar Metrics</span>
            {ps.northstar.map((n, i) => (
              <div key={i} style={{ ...styles.bullet, marginBottom: 8 }}>
                <span style={{ color: "#8957e5", marginTop: 1, flexShrink: 0 }}>★</span>
                <span style={{ color: "#8b949e", fontSize: 13, lineHeight: 1.6 }}>{n}</span>
              </div>
            ))}
          </div>
          <div style={{ ...styles.card, ...styles.pocBox }}>
            <span style={{ ...styles.sectionLabel, color: "#3fb950" }}>POC Scope (5-min Pitch Ready)</span>
            <p style={{ margin: 0, color: "#7ee787", lineHeight: 1.7, fontSize: 13 }}>{ps.pocScope}</p>
            <div style={{ marginTop: 14, padding: "8px 12px", background: "#0d1f0d", borderRadius: 6, fontSize: 11, color: "#3fb950" }}>
              ✓ Pitchable in 5 mins &nbsp;|&nbsp; ✓ CMS-ready integration path &nbsp;|&nbsp; ✓ Human-in-the-loop
            </div>
          </div>
        </div>
      </div>
    );
  };

  return (
    <div style={styles.app}>
      <div style={styles.header}>
        <span style={styles.badge}>Health Ministry · Enforcement Division</span>
        <h1 style={styles.h1}>AI in Healthcare Enforcement</h1>
        <p style={styles.subtitle}>Problem Statement Research Report · 8 Prioritised AI Opportunities · June 2026</p>
        <div style={styles.meta}>
          <span style={styles.metaItem}>📋 8 Problem Statements</span>
          <span style={styles.metaItem}>🌐 Global Market Research</span>
          <span style={styles.metaItem}>🤖 POC-Ready Scopes</span>
          <span style={styles.metaItem}>📊 Priority Scored & Ranked</span>
        </div>
      </div>

      <div style={styles.tabs}>
        {[
          { key: "exec", label: "Executive Summary" },
          { key: "statements", label: "All Problem Statements" },
          { key: "detail", label: "Detail View", disabled: !activePS },
        ].map(t => (
          <button key={t.key}
            style={styles.tab(tab === t.key)}
            disabled={t.disabled}
            onClick={() => { if (!t.disabled) setTab(t.key); }}>
            {t.label}
          </button>
        ))}
      </div>

      <div style={styles.body}>
        {tab === "exec" && renderExecSummary()}
        {tab === "statements" && renderPSGrid()}
        {tab === "detail" && activePS && renderDetail()}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
<!-- enforce.buildjoynow.com | deployed 2026-06-24 -->
</body>
</html>
